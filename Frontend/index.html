<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepAI — Interview Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise"></div>

  <nav class="nav">
    <div class="logo">PREP<span>AI</span></div>
    <div class="nav-tag">Beta</div>
  </nav>

  <main class="hero">
    <div class="hero-left">
      <div class="eyebrow">AI-Powered Mock Interviews</div>
      <h1 class="headline">
        TURN ANY<br>
        JOB POST<br>
        INTO YOUR<br>
        <span class="outline-text">INTERVIEW</span>
      </h1>
      <p class="desc">Paste a job description. Get 10 personalized questions, scored answers, and a full debrief — powered by AI.</p>
      <div class="steps-row">
        <div class="step"><span>01</span>Paste JD</div>
        <div class="step-arrow">→</div>
        <div class="step"><span>02</span>Answer</div>
        <div class="step-arrow">→</div>
        <div class="step"><span>03</span>Report</div>
      </div>
    </div>

    <div class="hero-right">
      <div class="card">
        <div class="card-label">Job Description</div>
        <textarea id="jobDescription" placeholder="Paste the job description here...

e.g. We are hiring a Python backend developer. Must know FastAPI, REST APIs, and SQL..."></textarea>
        <div class="char-row">
          <span id="charCount">0</span> characters
        </div>
        <button id="analyzeBtn" class="cta-btn">
          <span class="btn-label">Analyze & Start Interview</span>
          <span class="btn-arrow">↗</span>
        </button>
        <div class="card-note">Takes ~10 seconds · Powered by LLaMA 3.3</div>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
