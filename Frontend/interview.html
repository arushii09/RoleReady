<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepAI — Interview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise"></div>

  <nav class="nav">
    <div class="logo">PREP<span>AI</span></div>
    <div class="nav-tag" id="progressTag">Q 1 / 10</div>
  </nav>

  <main class="interview-main">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width: 10%"></div>
    </div>

    <div class="interview-card" id="questionCard">
      <div class="q-type" id="qType">Technical</div>
      <div class="q-number" id="qNumber">Question 01</div>
      <h2 class="q-text" id="qText">Loading question...</h2>

      <div class="answer-wrap">
        <label class="answer-label">Your Answer</label>
        <textarea id="answerInput" placeholder="Type your answer here. Be specific — mention tools, examples, and outcomes..."></textarea>
      </div>

      <button class="cta-btn" id="nextBtn">
        <span class="btn-label" id="nextBtnLabel">Submit & Next</span>
        <span class="btn-arrow">↗</span>
      </button>
    </div>

    <div class="interview-hint">
      Take your time. Treat this like a real interview.
    </div>
  </main>

  <script src="interview.js"></script>
</body>

<div class="loader" id="loader">
  <div class="loader-text">Setting up your interview...</div>
</div>

</html>
