services:
  backend:
    build: ./Backend
    container_name: roleready-backend
    ports:
      - "8000:8000"
    env_file: ./Backend/.env
    volumes:
      - ./Backend/roleready.db:/app/roleready.db

  frontend:
    build: ./Frontend
    container_name: roleready-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend